name: Daily Morning Briefing

on:
  schedule:
    - cron: "30 5 * * *"
      timezone: "Asia/Kolkata"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate briefing
        env:
          USER_NAME: Abdul
          TIMEZONE: Asia/Kolkata
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          TELUGU_RECIPIENT_EMAILS: ${{ secrets.TELUGU_RECIPIENT_EMAILS }}
          TELUGU_GROQ_MODEL: ${{ secrets.TELUGU_GROQ_MODEL }}
          WHATSAPP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_RECIPIENT_NUMBER: ${{ secrets.WHATSAPP_RECIPIENT_NUMBER }}
          WHATSAPP_TEMPLATE_NAME: ${{ secrets.WHATSAPP_TEMPLATE_NAME }}
          WHATSAPP_TEMPLATE_LANGUAGE: te
          WHATSAPP_GRAPH_API_VERSION: v23.0
        run: python main.py

      - name: Upload briefing files
        uses: actions/upload-artifact@v4
        with:
          name: briefing-artifact
          path: |
            output/briefing.html
            output/briefing-telugu.html
            output/whatsapp-telugu.txt
